name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate skill
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          skill = Path("SKILL.md").read_text(encoding="utf-8")
          assert skill.startswith("---\n"), "SKILL.md must start with YAML frontmatter"
          assert "name: kizu-engineering-partner" in skill
          assert "Canonical source:" in skill
          assert "https://raw.githubusercontent.com/Kizuchann/kizu-engineering-partner/main/SKILL.md" in skill
          assert skill.count("```") % 2 == 0, "unbalanced code fences"

          probe = skill.replace("/home/<name>", "").replace(r"C:\Users\<name>", "")
          assert not re.search(r"/home/[A-Za-z0-9._-]+/", probe), "absolute home path in SKILL.md"
          assert "C:\\Users\\" not in probe, "absolute Windows path in SKILL.md"

          for name in ("README.md", "index.html", "llms.txt", "robots.txt", "sitemap.xml", "LICENSE"):
              assert Path(name).is_file(), f"missing {name}"

          html = Path("index.html").read_text(encoding="utf-8")
          assert "Kizu Engineering Partner" in html
          assert "kizu-engineering-partner" in html
          print("validation ok")
          PY

      - name: Build site
        run: |
          mkdir -p _site/kizu-engineering-partner
          cp SKILL.md _site/kizu-engineering-partner/SKILL.md
          cp SKILL.md _site/SKILL.md
          cp SKILL.md _site/llms-full.txt
          cp README.md LICENSE index.html llms.txt robots.txt sitemap.xml _site/

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          version = hashlib.sha256(Path("SKILL.md").read_bytes()).hexdigest()[:12]
          catalog = {
              "skills": [
                  {
                      "name": "kizu-engineering-partner",
                      "version": version,
                      "files": ["SKILL.md"],
                  }
              ]
          }
          Path("_site/index.json").write_text(
              json.dumps(catalog, indent=2) + "\n", encoding="utf-8"
          )
          print(f"catalog version {version}")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
